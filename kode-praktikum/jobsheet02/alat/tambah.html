<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>NatureRent | Beranda</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>🏕️ NatureRent</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Alat</a></li>
                <li><a href="tambah.html" aria-current="page">Tambah Alat</a></li>
                <li><a href="../penyewa/list.html">Daftar Penyewa</a></li>
                <li><a href="../penyewa/tambah.html">Tambah Penyewa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Alat</h2>
            <form>
                <p>
                    <label for="nama_alat">Nama Alat</label><br>
                    <input type="text" id="nama_alat" name="nama_alat" required>
                </p>
                <p>
                    <label for="merk">Merk / Brand</label><br>
                    <input type="text" id="merk" name="merk" required>
                </p>
                <p>
                    <label for="tahun_beli">Tahun Beli</label><br>
                    <input type="number" id="tahun_beli" name="tahun_beli" min="1900" max="2026" required>
                </p>
                <p>
                    <label for="kode_barang">Kode Barang (angka dan strip)</label><br>
                    <input type="text" id="kode_barang" name="kode_barang">
                </p>
                <p>
                    <label for="stok">Stok</label><br>
                    <input type="number" id="stok" name="stok" min="0" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label><br>
                    <select id="kategori" name="kategori">
                        <option value="Tenda">Tenda</option>
                        <option value="Tas Carrier">Tas Carrier</option>
                        <option value="Alat Masak">Alat Masak</option>
                        <option value="Penerangan">Penerangan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NatureRent &mdash; Jobsheet 2</p>
    </footer>
</body>
</html>
