<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NatureRent | Daftar Alat</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>🏕️ NatureRent</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html" aria-current="page">Daftar Alat</a></li>
                <li><a href="tambah.html">Tambah Alat</a></li>
                <li><a href="../penyewa/list.html">Daftar Penyewa</a></li>
                <li><a href="../penyewa/tambah.html">Tambah Penyewa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Alat</h2>
            <div class="search-box">
                <label for="search-input">Cari Nama Alat</label>
                <input type="text" id="search-input" data-kolom="1" placeholder="Ketik nama alat...">
            </div>
            <p id="loading-indicator" style="display:none;">Memuat data...</p>
            <button type="button" id="btn-refresh">Muat Ulang Data</button>
            <p id="table-counter">Menghitung data...</p>
            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nama Alat</th>
                        <th>Kategori</th>
                        <th>Merk</th>
                        <th>Tahun Beli</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody data-sumber="../data/alat.json" data-kunci="nama_alat,kategori,merk,tahun_beli,stok" data-delay="3000">
                    
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NatureRent &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/daftar.js"></script>
</body>
</html>
