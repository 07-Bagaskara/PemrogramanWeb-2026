<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NatureRent | Daftar Penyewa</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>🏕️ NatureRent</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../alat/list.html">Daftar Alat</a></li>
                <li><a href="../alat/tambah.html">Tambah Alat</a></li>
                <li><a href="list.html" aria-current="page">Daftar Penyewa</a></li>
                <li><a href="tambah.html">Tambah Penyewa</a></li>
                
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Penyewa</h2>
            <div class="search-box">
                <label for="search-input">Cari Nama Penyewa</label>
                <input type="text" id="search-input" data-kolom="2" placeholder="Ketik nama penyewa...">
            </div>
            <p id="loading-indicator" style="display:none;">Memuat data...</p>
            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No. Identitas</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>No. HP</th>
                        <th>Tanggal Daftar</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody data-sumber="../data/penyewa.json" data-kunci="no_identitas,nama,alamat,no_hp,tanggal_daftar" data-delay="600">
                    
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NatureRent &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/daftar.js"></script>
</body>
</html>
