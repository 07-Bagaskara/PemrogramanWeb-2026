<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NatureRent | Tambah Penyewa</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>🏕️ NatureRent</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../alat/list.html">Daftar Alat</a></li>
                <li><a href="../alat/tambah.html">Tambah Alat</a></li>
                <li><a href="list.html">Daftar Penyewa</a></li>
                <li><a href="tambah.html" aria-current="page">Tambah Penyewa</a></li>
            </ul>
        </nav>
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    </header>

    <main>
        <section>
            <h2>Tambah Penyewa</h2>
            <form>
                <p>
                    <label for="nama">Nama Lengkap</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_identitas">No. Identitas (KTP/SIM)</label><br>
                    <input type="text" id="no_identitas" name="no_identitas" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NatureRent &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
